<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1e33">
  <title>SECURE CHAT | 怪盗関連事件特別捜査本部</title>
  <link rel="stylesheet" href="../assets/css/chat.css?v=20261001-takeover">
</head>
<body>
  <div id="secure-intro" class="secure-intro">
    <div class="secure-intro__noise"></div>
    <div class="secure-intro__panel">
      <div class="secure-mark" aria-hidden="true"><span>特</span></div>

      <p class="secure-intro__eyebrow">
        PHANTOM CRIME SPECIAL INVESTIGATION HQ
      </p>

      <h1>SECURE CHAT</h1>

      <p class="secure-intro__lead">
        捜査協力者用の暗号化通信に接続します。
      </p>

      <div id="connect-status" class="connect-status">
        <div class="connect-status__row">
          <span class="status-light"></span>
          <span id="connect-status-text">接続待機中</span>
        </div>
        <div class="connect-progress">
          <span id="connect-progress-bar"></span>
        </div>
      </div>

      <button id="connect-button" class="connect-button" type="button">
        セキュアチャット 接続開始
      </button>

      <p class="secure-intro__foot">
        この通信は怪盗関連事件特別捜査本部の捜査協力者専用回線です。
      </p>

      <p class="secure-intro__ai-note">
        ※本システムには警察本部の会話支援AIが搭載されています。
        会話内容や利用者の反応から感情・状況を推定し、
        必要に応じて返信・行動候補を表示する場合があります。
      </p>
    </div>
  </div>

  <main id="chat-app" class="chat-app" hidden>
    <header class="chat-header">
      <div class="chat-header__top">
        <div class="chat-header__identity">
          <div class="chat-avatar chat-avatar--header">相</div>
          <div>
            <div class="chat-header__name">相沢 直人</div>
            <div class="chat-header__dept">怪盗関連事件特別捜査本部</div>
          </div>
        </div>

        <div class="chat-header__secure">
          <span class="secure-dot"></span>
          暗号化接続
        </div>
      </div>

      <div class="chat-header__sub">
        <span>捜査協力者専用チャット</span>
        <span class="online"><i></i>接続中</span>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite" aria-label="チャット履歴"></section>


    <div id="chat-actions" class="chat-actions"></div>

    <form id="chat-form" class="composer" autocomplete="off">
      <input
        id="chat-input"
        type="text"
        placeholder="メッセージを入力"
        aria-label="メッセージを入力"
        enterkeyhint="send"
      >
      <button type="submit" aria-label="送信">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.4 20.1 21 12 3.4 3.9 3 10.2l12 1.8-12 1.8.4 6.3Z"/>
        </svg>
      </button>
    </form>
  
    <section id="session-closed" class="session-closed" hidden aria-live="polite">
      <div class="session-closed-inner">
        <div class="closed-kicker">SECURE CHAT</div>
        <div id="close-status" class="close-status">通信を終了しています…</div>
        <div id="closed-final-text" class="closed-final-text"></div>
        <div class="closed-note">この通信セッションは終了しています。</div>
      </div>
    </section>

</main>

  <script src="../assets/js/chat.js?v=20261001-chat-resume"></script>
</body>
</html>
