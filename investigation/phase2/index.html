<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NEXT PUZZLE</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%}
    html{background:#030405}

    body{
      margin:0;
      min-height:100vh;
      color:#eceeef;
      background:
        radial-gradient(circle at 50% -10%,rgba(55,63,72,.14),transparent 42%),
        linear-gradient(180deg,#030405 0%,#080a0c 48%,#030405 100%);
      font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 3px,
          rgba(255,255,255,.018) 3px 4px
        ),
        radial-gradient(
          circle at 30% 20%,
          rgba(255,255,255,.025) 0 1px,
          transparent 1px 100%
        );
      background-size:auto,8px 8px;
      mix-blend-mode:screen;
    }

    .wrap{
      position:relative;
      z-index:1;
      width:min(760px,100%);
      margin:0 auto;
      padding:54px 18px 76px;
    }

    .transmission{
      border:1px solid #1a2025;
      background:
        linear-gradient(150deg,rgba(255,255,255,.012),transparent 46%),
        rgba(7,9,11,.86);
      box-shadow:
        0 32px 100px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.018);
      padding:52px 42px 50px;
    }

    .meta{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:40px;
      color:#59636c;
      font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.22em;
      text-transform:uppercase;
    }

    .meta::before{
      content:"";
      width:6px;
      height:6px;
      border-radius:50%;
      background:#6c222b;
      box-shadow:0 0 12px rgba(108,34,43,.65);
      animation:pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{opacity:.3}
      50%{opacity:1}
    }

    .poem{
      margin:0;
      font-size:clamp(20px,3.8vw,29px);
      line-height:2.15;
      letter-spacing:.065em;
      font-weight:400;
      text-wrap:pretty;
    }

    .stanza{
      display:block;
      margin:0 0 34px;
      opacity:0;
      transform:translateY(8px);
      animation:reveal .7s ease forwards;
    }

    .stanza:nth-child(1){animation-delay:.10s}
    .stanza:nth-child(2){animation-delay:.35s}
    .stanza:nth-child(3){animation-delay:.60s}
    .stanza:last-child{margin-bottom:0}

    @keyframes reveal{
      to{
        opacity:1;
        transform:none;
      }
    }

    .poem strong{
      font-weight:500;
      color:#f3f4f5;
    }

    .latin{
      font-family:Georgia,"Times New Roman",serif;
      letter-spacing:.035em;
    }

    .divider{
      width:52px;
      height:1px;
      margin:46px 0 34px;
      background:linear-gradient(90deg,#3d444b,transparent);
    }

    .final-label{
      margin:0 0 9px;
      color:#56616a;
      font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .final-copy{
      margin:0 0 18px;
      color:#8b949c;
      font-size:13px;
      line-height:1.8;
      letter-spacing:.035em;
    }

    .answer-form{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      align-items:stretch;
    }

    .answer-form input{
      width:100%;
      min-width:0;
      border:1px solid #2b333a;
      border-radius:2px;
      outline:none;
      padding:14px 15px;
      color:#f1f2f3;
      background:#050708;
      font:600 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.12em;
      text-transform:uppercase;
      transition:border-color .18s,box-shadow .18s,background .18s;
    }

    .answer-form input:focus{
      border-color:#56626c;
      background:#080b0d;
      box-shadow:0 0 0 3px rgba(86,98,108,.09);
    }

    .answer-form button{
      border:1px solid #313941;
      border-radius:2px;
      padding:0 18px;
      color:#d7dadd;
      background:#11161a;
      font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.16em;
      cursor:pointer;
      transition:background .18s,border-color .18s,color .18s;
    }

    .answer-form button:hover{
      background:#181e23;
      border-color:#4a555f;
      color:#fff;
    }

    .answer-status{
      min-height:24px;
      margin:10px 0 0;
      color:#6f7880;
      font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.08em;
    }

    .answer-status.error{color:#8a5057}

    .foot{
      margin:34px 0 0;
      color:#3f474e;
      font:9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.18em;
    }

    @media(max-width:580px){
      .wrap{padding:20px 12px 48px}
      .transmission{padding:38px 24px 40px}
      .meta{margin-bottom:30px}
      .poem{line-height:2}
      .stanza{margin-bottom:28px}
      .answer-form{grid-template-columns:1fr}
      .answer-form button{min-height:46px}
    }

    @media(prefers-reduced-motion:reduce){
      .stanza,.meta::before{animation:none}
      .stanza{opacity:1;transform:none}
    }

    .transmission.ending{
      min-height:72vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .transmission.ending > :not(.ending-stage){
      display:none;
    }

    .ending-stage{
      display:none;
      min-height:440px;
    }

    .transmission.ending .ending-stage{
      display:block;
    }

    .ending-head{
      margin:0 0 30px;
      color:#59636c;
      font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.22em;
    }

    .ending-log{
      display:grid;
      gap:18px;
    }

    .ending-line{
      margin:0;
      opacity:0;
      transform:translateY(5px);
      color:#e6e8ea;
      font-size:clamp(17px,3.2vw,23px);
      line-height:1.9;
      letter-spacing:.04em;
      transition:opacity .28s ease,transform .28s ease;
    }

    .ending-line.show{
      opacity:1;
      transform:none;
    }

    .ending-line.ojisan{
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      color:#f0e7de;
    }

    .ending-line.birthday{
      margin-top:10px;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      font-size:clamp(24px,5vw,38px);
      font-weight:800;
      letter-spacing:.04em;
      color:#fff;
    }

    .ending-line.report{
      margin-top:14px;
      padding-top:22px;
      border-top:1px solid #242b31;
      color:#cfd4d8;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      font-size:15px;
    }

    body,
    .transmission{
      transition:
        background 1.1s ease,
        border-color .9s ease,
        box-shadow .9s ease,
        color .7s ease;
    }

    body.birthday-mode{
      color:#3f2d35;
      background:
        radial-gradient(circle at 10% 8%,rgba(255,255,255,.98),transparent 23%),
        radial-gradient(circle at 88% 12%,rgba(255,246,196,.95),transparent 28%),
        radial-gradient(circle at 18% 82%,rgba(255,214,232,.92),transparent 34%),
        radial-gradient(circle at 84% 76%,rgba(211,239,255,.94),transparent 34%),
        linear-gradient(135deg,#fff8da 0%,#ffe8f1 34%,#e6f5ff 67%,#fff3cf 100%);
      background-attachment:fixed;
    }

    body.birthday-mode::before{
      opacity:.18;
      mix-blend-mode:multiply;
      background:
        radial-gradient(circle at 20% 20%,rgba(255,127,161,.16) 0 2px,transparent 3px),
        radial-gradient(circle at 80% 16%,rgba(94,178,255,.15) 0 2px,transparent 3px),
        radial-gradient(circle at 70% 78%,rgba(255,194,68,.16) 0 2px,transparent 3px);
      background-size:42px 42px,54px 54px,62px 62px;
    }

    .transmission.birthday-reveal{
      border-color:rgba(255,255,255,.94);
      background:
        linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,250,246,.88));
      box-shadow:
        0 28px 80px rgba(121,83,105,.18),
        0 0 0 6px rgba(255,255,255,.28),
        inset 0 1px 0 #fff;
      backdrop-filter:blur(8px);
    }

    .birthday-reveal .ending-head{
      color:#d55c86;
      font-weight:800;
      letter-spacing:.18em;
    }

    .birthday-reveal .ending-line{
      color:#47313a;
      text-shadow:none;
    }

    .birthday-reveal .ending-line.ojisan{
      color:#7a3e5a;
      font-weight:650;
    }

    .birthday-reveal .ending-line.birthday{
      margin:8px 0 2px;
      padding:18px 16px;
      border-radius:18px;
      color:#c73970;
      background:
        linear-gradient(135deg,rgba(255,238,178,.86),rgba(255,220,234,.90),rgba(214,240,255,.90));
      font-size:clamp(30px,7vw,52px);
      line-height:1.35;
      font-weight:950;
      text-align:center;
      letter-spacing:.02em;
      box-shadow:
        0 12px 28px rgba(199,57,112,.12),
        inset 0 0 0 1px rgba(255,255,255,.95);
      text-shadow:0 2px 0 rgba(255,255,255,.92);
    }

    .ending-line.birthday-sub{
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      font-size:clamp(23px,4.5vw,34px);
      line-height:1.55;
      font-weight:900;
      color:#d34f7e;
      text-align:center;
      text-shadow:0 2px 0 rgba(255,255,255,.85);
    }

    .birthday-reveal .ending-line.report{
      padding:18px 18px 2px;
      border-top:2px dashed rgba(211,79,126,.28);
      color:#385a78;
      font-weight:700;
    }

    .ending-line.keyword{
      width:fit-content;
      margin:6px auto;
      padding:13px 17px;
      border:2px dashed #d45c88;
      border-radius:10px;
      background:#fff8fc;
      color:#a62e5d;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:clamp(18px,3.2vw,25px);
      font-weight:900;
      letter-spacing:.08em;
      box-shadow:0 8px 22px rgba(166,46,93,.10);
    }

    .ending-line.punchline{
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
      font-size:clamp(26px,5vw,40px);
      font-weight:950;
      color:#d13f75;
      text-align:center;
      text-shadow:0 2px 0 #fff;
    }

    .celebration-layer{
      position:fixed;
      inset:0;
      z-index:9998;
      pointer-events:none;
      overflow:hidden;
    }

    .confetti{
      position:absolute;
      top:-12vh;
      width:10px;
      height:18px;
      border-radius:3px;
      opacity:.96;
      animation:confettiFall var(--fall,5.4s) linear var(--delay,0s) forwards;
      transform:rotate(var(--rot,0deg));
    }

    @keyframes confettiFall{
      0%{
        transform:translate3d(0,-8vh,0) rotate(var(--rot,0deg));
      }
      45%{
        transform:translate3d(var(--drift,30px),48vh,0) rotate(calc(var(--rot,0deg) + 380deg));
      }
      100%{
        transform:translate3d(calc(var(--drift,30px) * -0.35),112vh,0) rotate(calc(var(--rot,0deg) + 760deg));
      }
    }

    .birthday-burst{
      position:fixed;
      inset:0;
      z-index:9997;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(circle at center,rgba(255,255,255,1) 0 8%,rgba(255,244,183,.92) 18%,rgba(255,210,230,.52) 42%,transparent 72%);
    }

    .birthday-burst.active{
      animation:birthdayBurst 1.05s ease-out forwards;
    }

    @keyframes birthdayBurst{
      0%{opacity:0;transform:scale(.74)}
      20%{opacity:1}
      100%{opacity:0;transform:scale(1.16)}
    }

    @media(prefers-reduced-motion:reduce){
      .confetti{animation:none;display:none}
      .birthday-burst.active{animation:none;opacity:0}
    }

    .glitch-flash{
      position:fixed;
      inset:0;
      z-index:9999;
      pointer-events:none;
      opacity:0;
      background:#000;
    }

    .glitch-flash.active{
      animation:endGlitch .65s steps(2,end);
    }

    @keyframes endGlitch{
      0%{opacity:0}
      12%{opacity:1;background:#000}
      24%{opacity:.82;background:repeating-linear-gradient(0deg,#d7d7d7 0 1px,#111 1px 4px)}
      38%{opacity:1;background:#000}
      52%{opacity:.65;background:repeating-linear-gradient(90deg,#777 0 2px,#000 2px 7px)}
      68%{opacity:1;background:#000}
      100%{opacity:0}
    }

  </style>
</head>

<body>
  <main class="wrap">
    <section class="transmission">
      <div class="meta">NEXT PUZZLE / PRIVATE TRANSMISSION</div>

      <div class="poem" aria-label="次の謎">
        <span class="stanza">
          十一の獣が並ぶ場所。<br>
          まずは、その群れの下へ。
        </span>

        <span class="stanza">
          次は、三と四の秩序に並ぶ<br>
          十二の黒き盤の下。
        </span>

        <span class="stanza">
          そして最後に、<span class="latin">Karl Blossfeldt</span>。<br>
          もの言わぬ命を、光の中に閉じ込めた男。<br>
          その一枚を纏う箱の中を探せ。
        </span>
      </div>

      <div class="divider"></div>

      <p class="final-label">FINAL ANSWER</p>
      <p class="final-copy">
        三つの場所で見つけたものから、最後の答えを導け。
      </p>

      <form class="answer-form" id="final-answer-form">
        <input
          id="final-answer"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="ENTER ANSWER"
          aria-label="最終回答"
        >
        <button type="submit">ANSWER</button>
      </form>

      <p class="answer-status" id="answer-status" aria-live="polite"></p>

      <p class="foot">THREE PLACES / ONE ANSWER</p>

      <section class="ending-stage" id="ending-stage" aria-live="polite">
        <p class="ending-head">FINAL TRANSMISSION</p>
        <div class="ending-log" id="ending-log"></div>
      </section>
    </section>
  </main>

  <div class="glitch-flash" id="glitch-flash" aria-hidden="true"></div>
  <div class="birthday-burst" id="birthday-burst" aria-hidden="true"></div>
  <div class="celebration-layer" id="celebration-layer" aria-hidden="true"></div>

  <script>
    (() => {
      // エンディングは読書時間ルールから1.5秒短縮する。
      const READING_CHARS_PER_SEC = 10;
      const EXTRA_PAUSE_MS = 2000;
      const MIN_MESSAGE_DELAY_MS = 3000;
      const MAX_MESSAGE_DELAY_MS = 14000;
      const ENDING_DELAY_REDUCTION_MS = 1500;
      const FINAL_ANSWERS = ['HAPPY BIRTHDAY'];
      const FINAL_SOLVED_KEY = 'phantomCaseFinalSolved';
      const ENDING_PROGRESS_KEY = 'phantomCaseFinalEndingProgress';
      const ENDING_COMPLETE_KEY = 'phantomCaseFinalEndingComplete';

      let persistedProgress = 0;
      let resumeRemaining = 0;

      const form = document.getElementById('final-answer-form');
      const input = document.getElementById('final-answer');
      const status = document.getElementById('answer-status');
      const transmission = document.querySelector('.transmission');
      const endingLog = document.getElementById('ending-log');
      const endingHead = document.querySelector('.ending-head');
      const flash = document.getElementById('glitch-flash');
      const birthdayBurst = document.getElementById('birthday-burst');
      const celebrationLayer = document.getElementById('celebration-layer');

      const normalize = value =>
        String(value || '')
          .trim()
          .replace(/[\s　_-]/g, '')
          .toUpperCase();

      const wait = ms => {
        if (resumeRemaining > 0) return Promise.resolve();
        return new Promise(resolve =>
          setTimeout(resolve, ms)
        );
      };

      function readingDelay(text){
        const readingMs = (String(text).length / READING_CHARS_PER_SEC) * 1000;
        return Math.max(
          MIN_MESSAGE_DELAY_MS,
          Math.min(MAX_MESSAGE_DELAY_MS, Math.round(readingMs + EXTRA_PAUSE_MS))
        ) - ENDING_DELAY_REDUCTION_MS;
      }

      async function addLine(text, className=''){
        const restoringThisLine = resumeRemaining > 0;
        const p = document.createElement('p');
        p.className = 'ending-line' + (className ? ' ' + className : '');
        p.textContent = text;
        endingLog.appendChild(p);

        if (restoringThisLine) {
          p.classList.add('show');
          resumeRemaining -= 1;
          return;
        }

        await new Promise(resolve => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              p.classList.add('show');
              resolve();
            });
          });
        });

        persistedProgress += 1;
        localStorage.setItem(ENDING_PROGRESS_KEY, String(persistedProgress));

        p.scrollIntoView({behavior:'smooth',block:'nearest'});
        await wait(readingDelay(text));
      }

      async function glitch(){
        if (resumeRemaining > 0) return;
        flash.classList.remove('active');
        void flash.offsetWidth;
        flash.classList.add('active');
        await wait(900);
        flash.classList.remove('active');
      }

      function launchConfetti(){
        celebrationLayer.innerHTML='';
        const colors=['#ff5f93','#ffbf3f','#54b7ff','#8d72ff','#54d6a4','#ff875f'];
        for(let i=0;i<110;i++){
          const piece=document.createElement('span');
          piece.className='confetti';
          piece.style.left=(Math.random()*100)+'vw';
          piece.style.background=colors[i%colors.length];
          piece.style.setProperty('--fall',(4.1+Math.random()*3.2)+'s');
          piece.style.setProperty('--delay',(Math.random()*.65)+'s');
          piece.style.setProperty('--drift',((-90+Math.random()*180))+'px');
          piece.style.setProperty('--rot',(Math.random()*180)+'deg');
          piece.style.width=(7+Math.random()*7)+'px';
          piece.style.height=(10+Math.random()*13)+'px';
          celebrationLayer.appendChild(piece);
        }
        setTimeout(()=>{ celebrationLayer.innerHTML=''; },8500);
      }

      function enterBirthdayMode(){
        document.body.classList.add('birthday-mode');
        transmission.classList.add('birthday-reveal');
        endingHead.textContent='🎉 BIRTHDAY MODE 🎉';

        if (resumeRemaining > 0) return;

        birthdayBurst.classList.remove('active');
        void birthdayBurst.offsetWidth;
        birthdayBurst.classList.add('active');

        launchConfetti();
      }

      async function runEnding(){
        transmission.classList.add('ending');

        // 最後までUNKNOWN USERとして振る舞う。
        await addLine('見事だ。');
        await addLine('すべての謎を解いたようだな。');
        await addLine('ならば約束通り、お前から預かったものを返してやろう。');
        await wait(900);
        await addLine('……その前に。');

        // ここで事件モードを終わらせ、誕生日サプライズへ切り替える。
        await glitch();
        enterBirthdayMode();
        await wait(650);

        await addLine('🎉🎂 HAPPY BIRTHDAY 🎂🎉','birthday');
        await addLine('30歳、おめでとう〜〜〜‼️🥳✨✨✨','birthday-sub');

        await wait(500);
        await addLine('お久しぶりの照り焼き〜〜〜😎✨','ojisan');
        await addLine('怪盗ヘンタイおじさんだヨ〜〜〜‼️🤣🤣🤣','ojisan');

        await addLine('いや〜〜〜、気づかなかったでしょ⁉️😏✨','ojisan');
        await addLine('別の怪盗さんだと思ったよね⁉️ 驚かせたくて、勝手に名前使っちゃった（爆笑）🤣🤣🤣','ojisan');
        await addLine('GLITCHくん、勝手に名前使ってゴメンネ〜〜〜🙏💦','ojisan');
        await addLine('許してちょんまげ〜〜💦💦💦','ojisan');

        await wait(700);
        await addLine('さてさて……😏','ojisan');
        await addLine('じゃあ、そろそろ約束のアレ。','ojisan');
        await addLine('おじさんが、「お前の大切なものを一つ預かった」って言ってたヤツなんだけどネ。','ojisan');

        await wait(700);
        await addLine('…………。','ojisan');
        await addLine('…………。','ojisan');
        await addLine('そんなものありません〜〜〜‼️🤣🤣🤣🤣🤣','punchline');
        await addLine('何も盗んでませ〜〜〜ん‼️🤣','ojisan');
        await addLine('あ、でもネ。おうちに入ったのはホントだヨ〜〜〜😎💦','ojisan');
        await addLine('でもでも‼️ 変なことは何にもしてないから安心してネ🤣','ojisan');
        await addLine('いや〜〜〜、それにしても……','ojisan');
        await addLine('新しいおうち、立派だネ〜〜〜🏠✨ おじさんビックリしちゃったヨ😳','ojisan');
        await addLine('まあ、おじさんのぞうさん🐘もなかなか立派なんだけどネ〜〜〜😏💕','ojisan');
        await addLine('今度見せてあ・げ・る💛','ojisan');

      form.addEventListener('submit', async event => {
        event.preventDefault();

        const value = normalize(input.value);

        if (!value) {
          status.className = 'answer-status error';
          status.textContent = '答えを入力せよ。';
          return;
        }

        if (!FINAL_ANSWERS.map(normalize).includes(value)) {
          status.className = 'answer-status error';
          status.textContent = '違う。もう一度考えろ。';
          return;
        }

        input.disabled = true;
        form.querySelector('button').disabled = true;
        status.className = 'answer-status';
        status.textContent = 'FINAL ANSWER ACCEPTED';

        localStorage.setItem(FINAL_SOLVED_KEY,'1');
        localStorage.setItem(ENDING_PROGRESS_KEY,'0');
        localStorage.removeItem(ENDING_COMPLETE_KEY);
        persistedProgress = 0;
        resumeRemaining = 0;

        await runEnding();
      });

      async function restoreSolvedEnding(){
        if (localStorage.getItem(FINAL_SOLVED_KEY) !== '1') return;

        input.disabled = true;
        form.querySelector('button').disabled = true;
        status.className = 'answer-status';
        status.textContent = 'FINAL ANSWER ACCEPTED';

        const rawProgress = localStorage.getItem(ENDING_PROGRESS_KEY);
        const isComplete = localStorage.getItem(ENDING_COMPLETE_KEY) === '1';

        if (isComplete || rawProgress === null) {
          // 旧版で正解済みの場合も、更新後に全メッセージを復元する。
          persistedProgress = rawProgress === null ? 0 : Number(rawProgress) || 0;
          resumeRemaining = Number.MAX_SAFE_INTEGER;
        } else {
          persistedProgress = Math.max(0, Number(rawProgress) || 0);
          resumeRemaining = persistedProgress;
        }

        await runEnding();
      }

      restoreSolvedEnding();
    })();
